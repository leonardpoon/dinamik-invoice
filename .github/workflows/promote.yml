name: Promote develop to main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse develop -> main PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_NUMBER=$(gh pr list --repo "$REPO" --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            if ! PR_URL=$(gh pr create --repo "$REPO" --base main --head develop \
              --title "Promote develop to main" \
              --body "Automated promotion: CI passed on develop, opening for auto-merge into main." 2>&1); then
              echo "$PR_URL"
              if echo "$PR_URL" | grep -qi "No commits between"; then
                echo "main is already up to date with develop; nothing to promote."
                exit 0
              fi
              exit 1
            fi
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --merge
